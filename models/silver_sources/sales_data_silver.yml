
version: 2

sources:
  - name: sales_data
    database: housing_intelligence
    schema: processed

    tables:
      - name: sales_data_silver
        description: "Beijing residential property transaction records"

        columns:
          - name: city
            description: "City of the property"
            data_tests:
              - not_null

          - name: district
            description: "Administrative district"
            data_tests:
              - not_null

          - name: business_district
            description: "Business district or neighborhood"
            data_tests:
              - not_null

          - name: community
            description: "Residential community name"
            data_tests:
              - not_null

          - name: orientation
            description: "Property orientation, potentially containing multiple directions"

          - name: area_sqm
            description: "Property area in square meters"
            data_tests:
              - not_null

          - name: listing_price_wan
            description: "Listing price in units of 10,000 CNY"
            data_tests:
              - not_null

          - name: deal_price_wan
            description: "Transaction price in units of 10,000 CNY"
            data_tests:
              - not_null:
                  config:
                    severity: warn

          - name: deal_cycle
            description: "Number of days between listing and transaction"

          - name: transaction_year
            description: "Year of transaction"
            data_tests:
              - not_null:
                  config:
                    severity: warn

          - name: _source_file
            description: "Original source file path"

          - name: _ingested_at
            description: "Timestamp when the record was ingested"

          - name: transaction_date
            description: "Date of property transaction"
            data_tests:
              - not_null

          - name: price_per_sqm_yuan
            description: "Transaction price per square meter in CNY"
            data_tests:
              - not_null

          - name: floor_position
            description: "Relative floor position: low, middle, or top"

          - name: floor_number
            description: "Actual floor number"

          - name: room_num
            description: "Number of bedrooms"

          - name: hall_num
            description: "Number of living rooms"

        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - city
                  - community
                  - transaction_date
                  - area_sqm
                  - deal_price_wan
              config:
                severity: warn
