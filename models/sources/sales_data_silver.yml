version: 2

sources:
  - name: landing
    database: housing_intelligence
    schema: raw

    tables:
      - name: sales_data
        columns:
          - name: date
            data_tests:
              - not_null:
                  config: 
                    severity: warn
          - name: city
            data_tests:
              - not_null:
                  config: 
                    severity: warn
              - accepted_values:
                  arguments:
                    values: ['Beijing']
                  config: 
                    severity: warn
        config:
          loaded_at_field: date
          freshness:
            warn_after:
              count: 365
              period: day
            error_after:
              count: 1460
              period: day

      - name: sales_data_incremental